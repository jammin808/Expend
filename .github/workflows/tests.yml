name: tests

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Create SQLite Database
        run: touch database/database.sqlite

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Type-check front end
        run: npx tsc --noEmit

      - name: Tests
        run: ./vendor/bin/phpunit

  # The same suite on MariaDB, the live server's database (10.11), so SQL that only SQLite accepts is caught here.
  mariadb:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Real environment variables win over phpunit.xml's SQLite settings and over .env.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          extensions: pdo_mysql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      # The backup test dumps and restores with the client tools, as the server does: MariaDB's, not the runner's MySQL 8.
      - name: Install the MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      # Newer MariaDB clients (11.4+, as on Ubuntu 26.04) insist on TLS by default, and the MariaDB 10.11 test server
      # offers none. Set in the system-wide file because the backup test runs the scripts with its own HOME.
      - name: Connect to the test database without TLS
        run: |
          printf '[client]\nskip-ssl\n' | sudo tee -a /etc/my.cnf
          mysql --version
          HOME=/tmp MYSQL_PWD=password mysql -h 127.0.0.1 -P 3306 -u root -N -e 'SELECT VERSION()'

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Tests
        run: ./vendor/bin/phpunit
