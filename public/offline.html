<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="robots" content="noindex, nofollow">
        <title>No signal · Expend</title>
        <style>
            body {
                margin: 0;
                padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
                font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
                background: #fff;
                color: #0a0a0a;
            }
            @media (prefers-color-scheme: dark) {
                body { background: #0a0a0a; color: #fafafa; }
                a.button { background: #fafafa; color: #0a0a0a; }
            }
            main { max-width: 28rem; margin: 0 auto; }
            h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
            a.button {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 56px;
                margin-top: 1.5rem;
                border-radius: 12px;
                background: #171717;
                color: #fafafa;
                font-weight: 600;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>No signal</h1>
            <p>This page needs signal. You can still add an expense: it waits on your phone and sends itself once you’re back online.</p>
            <a class="button" href="/quick">Add expense</a>
        </main>
    </body>
</html>
